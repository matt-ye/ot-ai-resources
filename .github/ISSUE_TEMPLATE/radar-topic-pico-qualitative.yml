name: "雷達主題：經驗與感受（PICo）"
description: "當事人的經驗、感受、意義（質性研究）。例：中風個案重返工作的經驗。"
title: "[雷達主題·經驗與感受] "
labels: ["雷達主題提案"]
body:
  - type: markdown
    attributes:
      value: |
        填完送出後，約 1～3 分鐘會出現一則留言：AI 寫的檢索式、判準、試搜篇數與最新 5 篇題目。
        看過覺得可以，加上 **核准** 標籤，程式才會把它寫進設定檔（推到新分支，你再建 PR 合併）。
        **中文填寫即可。請不要填病人、學生或未發表研究的資料。**
        族群與關注的現象會放進檢索式；情境、研究類型、排除寫進判準。注意：這是 JBI 的 PICo（小寫 o），和介入效果的 PICO 不同。
  - type: input
    id: label
    attributes:
      label: 主題名稱
      description: 報告上顯示的名稱，短一點。
      placeholder: "經驗與感受：…"
    validations:
      required: true
  - type: textarea
    id: p
    attributes:
      label: "P 族群（Population）"
      description: "誰的經驗？"
      placeholder: "中風後的工作年齡成人"
    validations:
      required: true
  - type: textarea
    id: i
    attributes:
      label: "I 關注的現象（phenomenon of Interest）"
      description: "想了解的經驗、感受或意義。"
      placeholder: "重返工作的經驗與阻礙"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Co 情境（Context，選填）"
      description: "場域、文化、制度背景。只用來篩選。"
      placeholder: "職業重建服務"
  - type: dropdown
    id: design
    attributes:
      label: "研究類型"
      multiple: true
      options:
        - 質性研究
        - 混合方法
        - 不限
  - type: textarea
    id: exclude
    attributes:
      label: 不要收的（選填）
      placeholder: 動物研究、研究計畫書
  - type: input
    id: replace
    attributes:
      label: 要取代的現有主題代號（選填）
      description: 想換掉現有主題才填，例如 stroke_occupational_therapy。留空＝新增一個主題。
