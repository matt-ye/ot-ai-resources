name: "雷達主題：盛行率／發生率（CoCoPop）"
description: "某個狀況有多少人有（盛行率、發生率）。例：社區長者的失智症盛行率。"
title: "[雷達主題·盛行率] "
labels: ["雷達主題提案"]
body:
  - type: markdown
    attributes:
      value: |
        填完送出後，約 1～3 分鐘會出現一則留言：AI 寫的檢索式、判準、試搜篇數與最新 5 篇題目。
        看過覺得可以，加上 **核准** 標籤，程式才會把它寫進設定檔（推到新分支，你再建 PR 合併）。
        **中文填寫即可。請不要填病人、學生或未發表研究的資料。**
        病況與族群會放進檢索式，再自動加一組流行病學詞（prevalence、incidence…）；情境（國家、場域、年代）寫進判準。這類題目沒有介入與對照，不要用 PICO 表單。問比例的 KAP（知識、態度、行為）調查也可以用這張：把 KAP 寫進「病況」欄（Munn 2015 的 Condition 明列 behavior、practice；知識、態度算進去屬延伸用法）。
  - type: input
    id: label
    attributes:
      label: 主題名稱
      description: 報告上顯示的名稱，短一點。
      placeholder: "盛行率／發生率：…"
    validations:
      required: true
  - type: textarea
    id: condition
    attributes:
      label: "Co 病況（Condition）"
      description: "要估計的疾病或健康狀況；KAP 調查就寫要看的知識、態度或做法。"
      placeholder: "失智症（含阿茲海默症）；或：對失智症照護的知識與態度"
    validations:
      required: true
  - type: textarea
    id: population
    attributes:
      label: "Pop 族群（Population）"
      description: "誰？年齡、場域、特定族群。"
      placeholder: "社區長者（65 歲以上）"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Co 情境（Context：國家、場域、年代，選填）"
      description: "國家或地區、場域（社區、機構、醫院）、年代。寫在這裡的只用來篩選，不放進檢索式。"
      placeholder: "台灣或東亞；2015 年以後的調查"
  - type: dropdown
    id: measure
    attributes:
      label: "要找的指標"
      multiple: true
      options:
        - 盛行率
        - 發生率
        - 兩者都要
  - type: textarea
    id: exclude
    attributes:
      label: 不要收的（選填）
      placeholder: 動物研究、研究計畫書
  - type: input
    id: replace
    attributes:
      label: 要取代的現有主題代號（選填）
      description: 想換掉現有主題才填，例如 stroke_occupational_therapy。留空＝新增一個主題。
